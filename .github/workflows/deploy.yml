name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push waits instead of cancelling one in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Gerar o site
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # fails until Settings → Pages → Source is set to "GitHub Actions" (see docs/DEPLOY.md)
      - name: Conferir o GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
        continue-on-error: true
      - name: Avisar que o Pages está desligado
        if: steps.pages.outcome != 'success'
        run: |
          echo "### GitHub Pages ainda não está ligado" >> "$GITHUB_STEP_SUMMARY"
          echo "Em Settings → Pages → Source, escolha **GitHub Actions** e rode este workflow de novo." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outcome == 'success'
        with:
          path: dist

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
