version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Fortaleza
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # typescript-eslint only supports TypeScript up to 6.0: update the two together, by hand
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # the Node types follow the Node version in .nvmrc (24)
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]
      fontes:
        patterns: ['@fontsource/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: America/Fortaleza
    commit-message:
      prefix: ci
