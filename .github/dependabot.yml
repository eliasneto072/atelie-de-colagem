version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Fortaleza
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]
      fontes:
        patterns: ['@fontsource/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: America/Fortaleza
    commit-message:
      prefix: ci
